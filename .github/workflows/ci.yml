name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check every script
        run: for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
      - name: Tests (uses the example candidate; renders a real PDF with the runner's Chrome)
        run: npm test
