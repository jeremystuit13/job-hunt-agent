# Default one-page layouts, used when a job has no JD-matched selection.json.
# `internship` also applies to any tech-category job. Entries with `only_if: tutoring`
# appear only for IT/Support or tutoring/teaching roles.
layouts:
  internship:
    experience:
      - { org: "SDSU Data Science Lab — Undergraduate Research Assistant", sub: "San Diego, CA", dates: "Sep 2025 – Present", bulletIds: [rs-1, rs-2] }
      - { org: "SDSU IT Division — Student IT Support Technician", sub: "San Diego, CA", dates: "Jan 2025 – Present", bulletIds: [it-2, it-1] }
    projects:
      - { org: "Campus Shuttle Tracker", sub: "Sole author · Python, FastAPI, SQLite", dates: "Nov 2025 – Present", bulletIds: [pt-1, pt-2] }
  parttime_tech:
    experience:
      - { org: "SDSU IT Division — Student IT Support Technician", sub: "San Diego, CA", dates: "Jan 2025 – Present", bulletIds: [it-1, it-2] }
      - { org: "SDSU Math Learning Center — Peer Tutor", sub: "San Diego, CA", dates: "Oct 2024 – May 2025", bulletIds: [tu-1] }
  parttime:
    experience:
      - { org: "SDSU IT Division — Student IT Support Technician", sub: "San Diego, CA", dates: "Jan 2025 – Present", bulletIds: [it-1] }
      - { org: "SDSU Math Learning Center — Peer Tutor", sub: "San Diego, CA", dates: "Oct 2024 – May 2025", bulletIds: [tu-1], only_if: tutoring }
      - { org: "Trader Joe's — Crew Member", sub: "San Diego, CA", dates: "Jun 2023 – Aug 2024", bulletIds: [rt-1] }

# The one bullet the cover letter quotes as prose. `framing` must be true of that bullet.
cover_letter:
  highlight_bullet: pt-1
  framing: "In a personal project, I"

# Disagreements between résumé sources are recorded, never silently resolved.
# The board's "Your details" panel flags any field with an open conflict.
factual_conflicts_found: []
