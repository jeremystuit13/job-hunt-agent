# MASTER RÉSUMÉ LIBRARY — EXAMPLE (fictional candidate "Alex Rivera").
# Copy to resume/master.yaml (gitignored) and replace with your own history:
#   cp resume/master.example.yaml resume/master.yaml
#
# This is not a document, it is a SUPERSET: every bullet you could ever use, each with a
# stable id, skill tags, and optional variants. Tailoring SELECTS from it, never invents.
#
# Rules enforced by scripts/render-resume.mjs:
#   * Every rendered line MUST trace to a bullet `id` here. No id => the build fails.
#   * Tailoring may re-word (verbs, emphasis, terminology) via `variants`.
#   * Tailoring may NOT change numbers, technologies, scope, or dates.
#   * `variants` are alternate phrasings of the SAME fact, chosen per job.
#   * `verified:` records where a claim came from, so nothing is unsourced.

