adzuna:
  enabled: true
  budget_per_day: 15
  country: us
  where: San Diego, California
  distance_km: 32
  results_per_page: 50
  max_pages: 2
  # Adzuna's `what` does an AND of every word — "part time software" requires the
  # LITERAL words "part", "time", AND "software" all present, which returned 0
  # results (verified empirically). Fixed two ways: (1) drop "part time" from the
  # query text and rely on the `part_time=1` API param instead (added below, always
  # sent) plus score.mjs's own employment_type gate as backstop; (2) use `what_or`
  # (verified: real param, OR semantics) for genuine either/or queries instead of
  # cramming "OR" into `what` as a literal word, which also returned 0.
  queries:
    - what: software
      track: parttime
    - what: student assistant
      track: parttime
    - what: IT support
      track: parttime
    - what: tutor computer science
      track: parttime
    - what: data entry
      track: parttime
    - what: front desk
      track: parttime
    - what_or: barista server retail cashier
      track: parttime
